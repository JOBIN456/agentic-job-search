<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Upload & Profile Form</title>

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            padding-top: max(24px, env(safe-area-inset-top));
            padding-bottom: max(24px, env(safe-area-inset-bottom));
            padding-left: max(16px, env(safe-area-inset-left));
            padding-right: max(16px, env(safe-area-inset-right));
            position: relative;
            overflow-x: hidden;
            color: #ffffff;
        }

        /* Animated background blobs */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            z-index: 0;
            pointer-events: none;
            max-width: 80vw;
            max-height: 80vw;
        }

        .blob-1 {
            width: 320px;
            height: 320px;
            background: #ff006e;
            top: -50px;
            right: -50px;
            animation: float 6s ease-in-out infinite;
        }

        .blob-2 {
            width: 260px;
            height: 260px;
            background: #00d4ff;
            bottom: -50px;
            left: -50px;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(30px);
            }
        }

        /* Main Container */
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 44px 36px;
            max-width: 620px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            position: relative;
            z-index: 1;
            margin: auto 0;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #ffffff;
            font-size: clamp(1.5rem, 4vw + 0.5rem, 2rem);
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.25;
        }

        .header p {
            color: rgba(255, 255, 255, 0.85);
            font-size: clamp(0.85rem, 1.5vw + 0.5rem, 0.95rem);
            line-height: 1.4;
        }

        /* Drag and Drop Area */
        .drag-drop-area {
            border: 2px dashed rgba(255, 255, 255, 0.5);
            border-radius: 14px;
            padding: 36px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.05);
            -webkit-tap-highlight-color: transparent;
        }

        .drag-drop-area.dragover {
            background: rgba(102, 126, 234, 0.3);
            border-color: rgba(255, 255, 255, 0.9);
            transform: scale(1.01);
        }

        .drag-drop-area.file-error {
            border-color: #ff6b81 !important;
            background: rgba(255, 107, 129, 0.08) !important;
            box-shadow: 0 0 14px rgba(255, 107, 129, 0.25) !important;
        }

        @media (hover: hover) {
            .drag-drop-area:hover {
                background: rgba(255, 255, 255, 0.1);
                border-color: rgba(255, 255, 255, 0.85);
            }
        }

        .drag-drop-icon {
            font-size: clamp(38px, 6vw, 48px);
            margin-bottom: 12px;
            animation: bounce 2s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .drag-drop-text h3 {
            color: #ffffff;
            font-size: clamp(0.95rem, 2vw + 0.4rem, 1.15rem);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .drag-drop-text p {
            color: rgba(255, 255, 255, 0.75);
            font-size: clamp(0.75rem, 1.5vw + 0.4rem, 0.85rem);
        }

        #cv-file {
            display: none;
        }

        /* File Info Box */
        .file-info {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.5);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 16px;
            color: #ffffff;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .file-info.show {
            display: flex;
        }

        .file-info-icon {
            font-size: 18px;
            flex-shrink: 0;
        }

        #fileName {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
            flex: 1;
        }

        /* Browse Button */
        .btn-upload {
            width: 100%;
            min-height: 44px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 24px;
            -webkit-tap-highlight-color: transparent;
        }

        @media (hover: hover) {
            .btn-upload:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            }
        }

        .btn-upload:active {
            transform: translateY(0);
        }

        /* Form Layout */
        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 18px;
        }

        .form-section {
            margin-bottom: 18px;
            position: relative;
        }

        .form-row .form-section {
            margin-bottom: 0;
        }

        .form-section label {
            display: block;
            color: #ffffff;
            font-size: 13.5px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .required-star {
            color: #ff6b81;
            margin-left: 3px;
            font-weight: 700;
        }

        .form-section input,
        .form-section select,
        .form-section textarea {
            width: 100%;
            min-height: 44px;
            padding: 11px 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.25s ease;
        }

        /* Prevent auto zoom on iOS Safari */
        @media screen and (max-width: 768px) {
            .form-section input,
            .form-section select,
            .form-section textarea {
                font-size: 16px;
            }
        }

        .form-section input::placeholder,
        .form-section textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-section input:focus,
        .form-section select:focus,
        .form-section textarea:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 12px rgba(102, 126, 234, 0.4);
        }

        .form-section select {
            cursor: pointer;
        }

        .form-section select option {
            background-color: #4a3b78;
            color: #ffffff;
        }

        .form-section textarea {
            min-height: 90px;
            resize: vertical;
            max-width: 100%;
            line-height: 1.5;
        }

        /* Password / Key toggle wrapper */
        .input-password-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .input-password-wrapper input {
            padding-right: 44px;
        }

        .btn-toggle-key {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-toggle-key:hover {
            background: rgba(255, 255, 255, 0.22);
            color: #ffffff;
        }

        .btn-toggle-key:active {
            transform: translateY(-50%) scale(0.95);
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            min-height: 48px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            -webkit-tap-highlight-color: transparent;
        }

        @media (hover: hover) {
            .btn-submit:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 20px rgba(245, 87, 108, 0.45);
            }
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Success Message */
        .success-message {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.5);
            color: #ffffff;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            display: none;
            margin-bottom: 20px;
            font-size: 14.5px;
            word-break: break-word;
        }

        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ================= jQuery Validator Styles ================= */
        label.error {
            color: #ff6b81;
            font-size: 12.5px;
            font-weight: 500;
            margin-top: 6px;
            display: block;
            animation: fadeInError 0.2s ease-in-out;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
            letter-spacing: 0.2px;
        }

        @keyframes fadeInError {
            from {
                opacity: 0;
                transform: translateY(-3px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Highlight invalid form inputs */
        .form-section input.error,
        .form-section select.error,
        .form-section textarea.error {
            border-color: #ff6b81 !important;
            background: rgba(255, 107, 129, 0.12) !important;
            box-shadow: 0 0 10px rgba(255, 107, 129, 0.35) !important;
        }

        /* Subtle valid field indicator */
        .form-section input.valid:not([type="file"]),
        .form-section select.valid,
        .form-section textarea.valid {
            border-color: rgba(76, 175, 80, 0.65);
        }

        /* Responsive Breakpoints */
        @media (max-width: 640px) {
            body {
                padding: 16px 12px;
            }

            .container {
                padding: 30px 18px;
                border-radius: 18px;
            }

            .header {
                margin-bottom: 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 16px;
                margin-bottom: 16px;
            }

            .drag-drop-area {
                padding: 30px 16px;
                margin-bottom: 14px;
            }

            .btn-upload {
                margin-bottom: 20px;
            }

            .bg-blob {
                filter: blur(60px);
                opacity: 0.3;
            }

            .blob-1 {
                width: 200px;
                height: 200px;
            }

            .blob-2 {
                width: 180px;
                height: 180px;
            }
        }

        @media (max-width: 380px) {
            body {
                padding: 12px 8px;
            }

            .container {
                padding: 22px 14px;
                border-radius: 14px;
            }

            .drag-drop-area {
                padding: 24px 12px;
            }

            .form-section label {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <!-- Background blobs -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Upload Your CV</h1>
            <p>Complete your profile to get matched with the best opportunities</p>
        </div>

        <!-- Success Message -->
        <div class="success-message" id="successMessage">
            ✓ Profile submitted successfully!
        </div>

        <!-- Form -->
        <form id="profileForm" novalidate="novalidate">
            <!-- Drag and Drop Area -->
            <div class="drag-drop-area" id="dragDropArea">
                <div class="drag-drop-icon">📁</div>
                <div class="drag-drop-text">
                    <h3>Drag & Drop your CV here</h3>
                    <p>or click to browse (PDF, DOC, DOCX)</p>
                </div>
            </div>

            <!-- File Info -->
            <div class="file-info" id="fileInfo">
                <div class="file-info-icon">✓</div>
                <div id="fileName"></div>
            </div>

            <!-- Upload Button -->
            <button type="button" class="btn-upload" id="browseBtn">Browse Files</button>

            <!-- Hidden File Input (Validated by jQuery Validator) -->
            <input type="file" id="cv-file" name="cvFile" accept=".pdf,.doc,.docx" style="display: none;">

            <!-- Form Fields -->
            <div class="form-section">
                <label for="fullName">Full Name <span class="required-star">*</span></label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name">
            </div>

            <div class="form-row">
                <div class="form-section">
                    <label for="email">Email Address <span class="required-star">*</span></label>
                    <input type="email" id="email" name="email" placeholder="your@email.com">
                </div>
                <div class="form-section">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000">
                </div>
            </div>

            <div class="form-row">
                <div class="form-section">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" placeholder="City, Country">
                </div>
                <div class="form-section">
                    <label for="experience">Years of Experience <span class="required-star">*</span></label>
                    <select id="experience" name="experience">
                        <option value="">Select...</option>
                        <option value="0-1">0-1 Years</option>
                        <option value="1-3">1-3 Years</option>
                        <option value="3-5">3-5 Years</option>
                        <option value="5-10">5-10 Years</option>
                        <option value="10+">10+ Years</option>
                    </select>
                </div>
            </div>

            <div class="form-section">
                <label for="jobTitle">Desired Job Title</label>
                <input type="text" id="jobTitle" name="jobTitle" placeholder="e.g., Software Engineer, Product Manager">
            </div>

            <!-- API Keys Section -->
            <div class="form-row">
                <div class="form-section">
                    <label for="apifyKey">Apify Key <span class="required-star">*</span></label>
                    <div class="input-password-wrapper">
                        <input type="password" id="apifyKey" name="apifyKey" placeholder="Enter your Apify key" autocomplete="off">
                        <button type="button" class="btn-toggle-key" onclick="toggleKeyVisibility('apifyKey', this)" aria-label="Toggle Apify key visibility" title="Show/Hide Key">👁️</button>
                    </div>
                </div>
                <div class="form-section">
                    <label for="groqKey">Groq LLM Key <span class="required-star">*</span></label>
                    <div class="input-password-wrapper">
                        <input type="password" id="groqKey" name="groqKey" placeholder="Enter your Groq LLM key" autocomplete="off">
                        <button type="button" class="btn-toggle-key" onclick="toggleKeyVisibility('groqKey', this)" aria-label="Toggle Groq key visibility" title="Show/Hide Key">👁️</button>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <label for="bio">Professional Summary</label>
                <textarea id="bio" name="bio" rows="4" placeholder="Tell us about yourself and your career goals..."></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">Submit Profile</button>
        </form>
    </div>

    <!-- Scripts: jQuery & jQuery Validation Library -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.21.0/dist/jquery.validate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.21.0/dist/additional-methods.min.js"></script>

    <script>
        // Toggle API Key visibility
        function toggleKeyVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🔒';
                btn.setAttribute('title', 'Hide Key');
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
                btn.setAttribute('title', 'Show Key');
            }
        }

        $(document).ready(function () {
            const dragDropArea = document.getElementById('dragDropArea');
            const cvFileInput = document.getElementById('cv-file');
            const browseBtn = document.getElementById('browseBtn');
            const fileInfo = document.getElementById('fileInfo');
            const fileName = document.getElementById('fileName');

            // Browse button click
            browseBtn.addEventListener('click', () => {
                cvFileInput.click();
            });

            // Drag and Drop Area click to browse
            dragDropArea.addEventListener('click', () => {
                cvFileInput.click();
            });

            // Drag and drop events
            dragDropArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                dragDropArea.classList.add('dragover');
            });

            dragDropArea.addEventListener('dragleave', () => {
                dragDropArea.classList.remove('dragover');
            });

            dragDropArea.addEventListener('drop', (e) => {
                e.preventDefault();
                dragDropArea.classList.remove('dragover');

                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    cvFileInput.files = files;
                    handleFileSelect();
                    // Trigger jQuery Validator for the file
                    $(cvFileInput).valid();
                }
            });

            // File input change
            cvFileInput.addEventListener('change', () => {
                handleFileSelect();
                // Trigger jQuery Validator for the file
                $(cvFileInput).valid();
            });

            // Handle file selection preview
            function handleFileSelect() {
                if (cvFileInput.files.length > 0) {
                    const file = cvFileInput.files[0];
                    const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
                    fileName.textContent = `📄 ${file.name} (${sizeMB} MB)`;
                    fileInfo.classList.add('show');
                    dragDropArea.style.opacity = '0.65';
                } else {
                    fileInfo.classList.remove('show');
                    dragDropArea.style.opacity = '1';
                }
            }

            // ==========================================
            // Custom jQuery Validator Methods
            // ==========================================

            // Validate file extension (.pdf, .doc, .docx)
            $.validator.addMethod("cvExtension", function (value, element) {
                if (this.optional(element) || !element.files || !element.files.length) {
                    return true;
                }
                const ext = element.files[0].name.split('.').pop().toLowerCase();
                return ['pdf', 'doc', 'docx'].indexOf(ext) !== -1;
            }, "Please upload a valid PDF or Word document (.pdf, .doc, .docx)");

            // Validate file size (max 5MB)
            $.validator.addMethod("cvFileSize", function (value, element, param) {
                if (this.optional(element) || !element.files || !element.files.length) {
                    return true;
                }
                return element.files[0].size <= param;
            }, "File size must not exceed 5MB");

            // Validate phone number format (optional, but validated if filled)
            $.validator.addMethod("customPhone", function (value, element) {
                return this.optional(element) || /^[+]?[(]?[0-9]{1,4}[)]?[-\s./0-9]{6,15}$/.test(value.trim());
            }, "Please enter a valid phone number");

            // ==========================================
            // jQuery Validation Initialization
            // ==========================================
            const validator = $("#profileForm").validate({
                // Allow validation of the hidden cvFile input
                ignore: ":hidden:not(#cv-file)",

                // Validate on user action
                onfocusout: function (element) {
                    $(element).valid();
                },
                onkeyup: function (element) {
                    $(element).valid();
                },

                // Validation Rules
                rules: {
                    cvFile: {
                        required: true,
                        cvExtension: true,
                        cvFileSize: 5 * 1024 * 1024 // 5MB
                    },
                    fullName: {
                        required: true,
                        minlength: 2
                    },
                    email: {
                        required: true,
                        email: true
                    },
                    phone: {
                        customPhone: true
                    },
                    location: {
                        minlength: 2
                    },
                    experience: {
                        required: true
                    },
                    jobTitle: {
                        minlength: 2
                    },
                    apifyKey: {
                        required: true,
                        minlength: 8
                    },
                    groqKey: {
                        required: true,
                        minlength: 8
                    },
                    bio: {
                        minlength: 10
                    }
                },

                // Custom Error Messages
                messages: {
                    cvFile: {
                        required: "Please upload your CV before submitting",
                        cvExtension: "Only .pdf, .doc, and .docx formats are supported",
                        cvFileSize: "File size exceeds the 5MB limit"
                    },
                    fullName: {
                        required: "Please enter your full name",
                        minlength: "Full name must be at least 2 characters long"
                    },
                    email: {
                        required: "Please enter your email address",
                        email: "Please enter a valid email address (e.g., name@example.com)"
                    },
                    phone: {
                        customPhone: "Please enter a valid phone number"
                    },
                    location: {
                        minlength: "Location must be at least 2 characters long"
                    },
                    experience: {
                        required: "Please select your years of experience"
                    },
                    jobTitle: {
                        minlength: "Desired job title must be at least 2 characters long"
                    },
                    apifyKey: {
                        required: "Please enter your Apify key",
                        minlength: "Apify key must be at least 8 characters long"
                    },
                    groqKey: {
                        required: "Please enter your Groq LLM key",
                        minlength: "Groq LLM key must be at least 8 characters long"
                    },
                    bio: {
                        minlength: "Professional summary should be at least 10 characters long"
                    }
                },

                // Precise Error Placement
                errorPlacement: function (error, element) {
                    if (element.attr("name") === "cvFile") {
                        error.insertAfter("#browseBtn");
                    } else if (element.parent(".input-password-wrapper").length) {
                        error.insertAfter(element.parent(".input-password-wrapper"));
                    } else {
                        error.insertAfter(element);
                    }
                },

                // Error highlighting
                highlight: function (element, errorClass, validClass) {
                    $(element).addClass(errorClass).removeClass(validClass);
                    if ($(element).attr('id') === 'cv-file') {
                        $('#dragDropArea').addClass('file-error');
                    }
                },

                // Error un-highlighting
                unhighlight: function (element, errorClass, validClass) {
                    $(element).removeClass(errorClass).addClass(validClass);
                    if ($(element).attr('id') === 'cv-file') {
                        $('#dragDropArea').removeClass('file-error');
                    }
                },

                // Successful Form Submission
                submitHandler: function (form) {
                    const formData = {
                        cv: cvFileInput.files[0] ? cvFileInput.files[0].name : '',
                        fullName: $('#fullName').val().trim(),
                        email: $('#email').val().trim(),
                        phone: $('#phone').val().trim(),
                        location: $('#location').val().trim(),
                        experience: $('#experience').val(),
                        jobTitle: $('#jobTitle').val().trim(),
                        apifyKey: $('#apifyKey').val().trim(),
                        groqKey: $('#groqKey').val().trim(),
                        bio: $('#bio').val().trim()
                    };

                    console.log("Validated Form Submission:", formData);

                    // Show success banner
                    const $success = $('#successMessage');
                    $success.addClass('show');

                    // Reset form after 2.5 seconds
                    setTimeout(() => {
                        form.reset();
                        $('#fileInfo').removeClass('show');
                        $('#dragDropArea').css('opacity', '1').removeClass('file-error');
                        $success.removeClass('show');

                        // Reset validator states
                        validator.resetForm();
                        $('#profileForm').find('.valid, .error').removeClass('valid error');
                    }, 2500);

                    return false;
                }
            });
        });
    </script>
</body>
</html>
