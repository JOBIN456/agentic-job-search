<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Upload & Profile Form</title>

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
            color: #ffffff;
        }

        /* Animated background blobs */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            z-index: 0;
            pointer-events: none;
        }

        .blob-1 {
            width: 320px;
            height: 320px;
            background: #ff006e;
            top: -50px;
            right: -50px;
            animation: float 6s ease-in-out infinite;
        }

        .blob-2 {
            width: 260px;
            height: 260px;
            background: #00d4ff;
            bottom: -50px;
            left: -50px;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(30px); }
        }

        /* Main Container */
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 44px 36px;
            max-width: 620px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            position: relative;
            z-index: 1;
            margin: auto 0;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            color: #ffffff;
            font-size: clamp(1.5rem, 4vw + 0.5rem, 2rem);
            margin-bottom: 8px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.85);
            font-size: clamp(0.85rem, 1.5vw + 0.5rem, 0.95rem);
        }

        /* Drag and Drop Area */
        .drag-drop-area {
            border: 2px dashed rgba(255, 255, 255, 0.5);
            border-radius: 14px;
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.05);
        }

        .drag-drop-area.dragover {
            background: rgba(102, 126, 234, 0.3);
            border-color: rgba(255, 255, 255, 0.9);
        }

        .drag-drop-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .drag-drop-text h3 {
            color: #ffffff;
            font-size: 17px;
            margin-bottom: 5px;
        }

        .drag-drop-text p {
            color: rgba(255, 255, 255, 0.75);
            font-size: 13px;
        }

        #cv-file {
            display: none;
        }

        /* File Info Box */
        .file-info {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.5);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 16px;
            color: #ffffff;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .file-info.show {
            display: flex;
        }

        #fileName {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        /* Browse Button */
        .btn-upload {
            width: 100%;
            min-height: 44px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 22px;
        }

        .btn-upload:hover {
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        /* Form Layout */
        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-section {
            margin-bottom: 16px;
        }

        .form-row .form-section {
            margin-bottom: 0;
        }

        .form-section label {
            display: block;
            color: #ffffff;
            font-size: 13.5px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .required-star {
            color: #ff6b81;
            margin-left: 2px;
        }

        .form-section input,
        .form-section select,
        .form-section textarea {
            width: 100%;
            min-height: 44px;
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.25s ease;
        }

        @media (max-width: 768px) {
            .form-section input,
            .form-section select,
            .form-section textarea {
                font-size: 16px;
            }
        }

        .form-section input::placeholder,
        .form-section textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-section input:focus,
        .form-section select:focus,
        .form-section textarea:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.7);
        }

        .form-section select option {
            background-color: #4a3b78;
            color: #ffffff;
        }

        .form-section textarea {
            min-height: 85px;
            resize: vertical;
        }

        /* Password Wrapper */
        .input-password-wrapper {
            position: relative;
            width: 100%;
        }

        .input-password-wrapper input {
            padding-right: 44px;
        }

        .btn-toggle-key {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #ffffff;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            min-height: 48px;
            padding: 13px 28px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        /* Success Message */
        .success-message {
            background: rgba(76, 175, 80, 0.25);
            border: 1px solid rgba(76, 175, 80, 0.6);
            color: #ffffff;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            display: none;
            margin-bottom: 18px;
            font-size: 14.5px;
        }

        .success-message.show {
            display: block;
        }

        /* Validation Error Styles */
        label.error {
            color: #ff6b81;
            font-size: 12px;
            font-weight: 500;
            margin-top: 4px;
            display: block;
        }

        .form-section input.error,
        .form-section select.error {
            border-color: #ff6b81 !important;
            background: rgba(255, 107, 129, 0.1) !important;
        }

        /* Responsive Breakpoints */
        @media (max-width: 640px) {
            body {
                padding: 16px 12px;
            }

            .container {
                padding: 28px 18px;
                border-radius: 18px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .drag-drop-area {
                padding: 26px 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Background blobs -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Upload Your CV</h1>
            <p>Complete your profile to get matched with the best opportunities</p>
        </div>

        <!-- Success Message -->
        <div class="success-message" id="successMessage">
            ✓ Profile submitted successfully!
        </div>

        <!-- Form -->
        <form id="profileForm">
            <!-- Drag and Drop Area -->
            <div class="drag-drop-area" id="dragDropArea">
                <div class="drag-drop-icon">📁</div>
                <div class="drag-drop-text">
                    <h3>Drag & Drop your CV here</h3>
                    <p>or click to browse (PDF, DOC, DOCX)</p>
                </div>
            </div>

            <!-- File Info -->
            <div class="file-info" id="fileInfo">
                <div>✓</div>
                <div id="fileName"></div>
            </div>

            <!-- Browse Button -->
            <button type="button" class="btn-upload" id="browseBtn">Browse Files</button>
            <input type="file" id="cv-file" name="cvFile" accept=".pdf,.doc,.docx">

            <!-- Form Fields -->
            <div class="form-section">
                <label for="fullName">Full Name <span class="required-star">*</span></label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name">
            </div>

            <div class="form-row">
                <div class="form-section">
                    <label for="email">Email Address <span class="required-star">*</span></label>
                    <input type="email" id="email" name="email" placeholder="your@email.com">
                </div>
                <div class="form-section">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000">
                </div>
            </div>

            <div class="form-row">
                <div class="form-section">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" placeholder="City, Country">
                </div>
                <div class="form-section">
                    <label for="experience">Years of Experience <span class="required-star">*</span></label>
                    <select id="experience" name="experience">
                        <option value="">Select...</option>
                        <option value="0-1">0-1 Years</option>
                        <option value="1-3">1-3 Years</option>
                        <option value="3-5">3-5 Years</option>
                        <option value="5-10">5-10 Years</option>
                        <option value="10+">10+ Years</option>
                    </select>
                </div>
            </div>

            <div class="form-section">
                <label for="jobTitle">Desired Job Title</label>
                <input type="text" id="jobTitle" name="jobTitle" placeholder="e.g., Software Engineer">
            </div>

            <!-- API Keys Section -->
            <div class="form-row">
                <div class="form-section">
                    <label for="apifyKey">Apify Key <span class="required-star">*</span></label>
                    <div class="input-password-wrapper">
                        <input type="password" id="apifyKey" name="apifyKey" placeholder="Enter your Apify key" autocomplete="off">
                        <button type="button" class="btn-toggle-key" onclick="toggleKeyVisibility('apifyKey', this)" title="Show/Hide">👁️</button>
                    </div>
                </div>
                <div class="form-section">
                    <label for="groqKey">Groq LLM Key <span class="required-star">*</span></label>
                    <div class="input-password-wrapper">
                        <input type="password" id="groqKey" name="groqKey" placeholder="Enter your Groq key" autocomplete="off">
                        <button type="button" class="btn-toggle-key" onclick="toggleKeyVisibility('groqKey', this)" title="Show/Hide">👁️</button>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit">Submit Profile</button>
        </form>
    </div>

    <!-- jQuery & jQuery Validation -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.21.0/dist/jquery.validate.min.js"></script>

    <script>
        const dragDropArea = document.getElementById('dragDropArea');
        const cvFileInput = document.getElementById('cv-file');
        const browseBtn = document.getElementById('browseBtn');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');

        browseBtn.addEventListener('click', () => cvFileInput.click());
        dragDropArea.addEventListener('click', () => cvFileInput.click());

        dragDropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dragDropArea.classList.add('dragover');
        });

        dragDropArea.addEventListener('dragleave', () => {
            dragDropArea.classList.remove('dragover');
        });

        dragDropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dragDropArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                cvFileInput.files = e.dataTransfer.files;
                handleFileSelect();
            }
        });

        cvFileInput.addEventListener('change', handleFileSelect);

        function handleFileSelect() {
            if (cvFileInput.files.length) {
                fileName.textContent = '📄 ' + cvFileInput.files[0].name;
                fileInfo.classList.add('show');
                dragDropArea.style.opacity = '0.6';
            }
        }

        function toggleKeyVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🔒';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        $(document).ready(function () {
            $("#profileForm").validate({
                rules: {
                    fullName: {
                        required: true,
                        minlength: 3,
                        maxlength: 50
                    },
                    email: {
                        required: true,
                        email: true
                    },
                    experience: {
                        required: true
                    },
                    apifyKey: {
                        required: true,
                        minlength: 5,
                        maxlength: 100
                    },
                    groqKey: {
                        required: true,
                        minlength: 5,
                        maxlength: 100
                    }
                },
                messages: {
                    fullName: {
                        required: "Please enter your name",
                        minlength: "Name must be at least 3 characters",
                        maxlength: "Name cannot exceed 50 characters"
                    },
                    email: {
                        required: "Please enter your email",
                        email: "Please enter a valid email"
                    },
                    experience: {
                        required: "Please select your experience"
                    },
                    apifyKey: {
                        required: "Please enter your Apify key",
                        minlength: "Apify key is too short"
                    },
                    groqKey: {
                        required: "Please enter your Groq key",
                        minlength: "Groq key is too short"
                    }
                },
                errorPlacement: function (error, element) {
                    if (element.parent(".input-password-wrapper").length) {
                        error.insertAfter(element.parent(".input-password-wrapper"));
                    } else {
                        error.insertAfter(element);
                    }
                },
                submitHandler: function (form) {
                    if (!cvFileInput.files.length) {
                        alert("Please upload your CV");
                        return;
                    }

                    const formData = new FormData();
                    formData.append("cvFile", cvFileInput.files[0]);
                    formData.append("fullName", $("#fullName").val().trim());
                    formData.append("email", $("#email").val().trim());
                    formData.append("phone", $("#phone").val().trim());
                    formData.append("location", $("#location").val().trim());
                    formData.append("experience", $("#experience").val());
                    formData.append("jobTitle", $("#jobTitle").val().trim());
                    formData.append("apifyKey", $("#apifyKey").val().trim());
                    formData.append("groqKey", $("#groqKey").val().trim());

                    const $btn = $(form).find(".btn-submit");
                    $btn.prop("disabled", true).text("Submitting...");

                    $.ajax({
                        url: "/submit_cv",
                        type: "POST",
                        data: formData,
                        processData: false,
                        contentType: false,
                        success: function (res) {
                            $("#successMessage").text("✓ " + (res.message || "Profile submitted successfully!")).addClass("show");
                            setTimeout(() => {
                                form.reset();
                                $("#fileInfo").removeClass("show");
                                $("#dragDropArea").css("opacity", "1");
                                $("#successMessage").removeClass("show");
                                $btn.prop("disabled", false).text("Submit Profile");
                            }, 2000);
                        },
                        error: function (xhr) {
                            $btn.prop("disabled", false).text("Submit Profile");
                            const err = xhr.responseJSON && xhr.responseJSON.detail ? xhr.responseJSON.detail : "Error submitting profile. Please try again.";
                            alert(err);
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
