<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1f2937;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: #111827;
            color: white;
            padding: 20px 15px;
            transition: 0.3s;
            z-index: 1000;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            padding: 10px;
            margin-bottom: 30px;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin-bottom: 8px;
        }

        .menu a {
            display: block;
            padding: 12px 15px;
            color: #d1d5db;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.2s;
        }

        .menu a:hover,
        .menu a.active {
            background: #2563eb;
            color: white;
        }

        /* ================= MAIN ================= */

        .main {
            margin-left: 240px;
            min-height: 100vh;
            transition: 0.3s;
        }

        /* ================= TOP HEADER ================= */

        .top-header {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: 1px solid #e5e7eb;
        }

        .page-title {
            font-size: 22px;
            font-weight: 600;
        }

        .admin-section {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .admin-name {
            font-weight: 600;
        }

        .logout-btn {
            border: none;
            background: #ef4444;
            color: white;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        /* ================= CONTENT ================= */

        .content {
            padding: 30px;
        }

        /* ================= DASHBOARD CARDS ================= */

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .card h3 {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
        }

        /* ================= TABLE HEADER ================= */

        .table-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .table-header h2 {
            font-size: 20px;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        /* ================= TABLE ================= */

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th,
        td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
            font-size: 14px;
            color: #4b5563;
        }

        td {
            font-size: 14px;
        }

        .status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            background: #dcfce7;
            color: #166534;
        }

        /* ================= ACTION BUTTONS ================= */

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }

        .edit-btn {
            background: #f59e0b;
        }

        .edit-btn:hover {
            background: #d97706;
        }

        .delete-btn {
            background: #ef4444;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        /* ================= MODAL ================= */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 10px;
            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 20px;
        }

        .close {
            font-size: 25px;
            cursor: pointer;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #2563eb;
        }

        .save-btn {
            width: 100%;
            padding: 11px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        /* ================= MOBILE MENU ================= */

        .menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 25px;
            cursor: pointer;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 900px) {

            .cards {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 768px) {

            .sidebar {
                left: -240px;
            }

            .sidebar.show {
                left: 0;
            }

            .main {
                margin-left: 0;
            }

            .menu-btn {
                display: block;
            }

            .top-header {
                padding: 0 15px;
            }

            .page-title {
                display: none;
            }

            .content {
                padding: 20px 15px;
            }

            .admin-name {
                display: none;
            }

            .table-header {
                align-items: flex-start;
                gap: 10px;
            }
        }

    </style>
</head>

<body>

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar" id="sidebar">

        <div class="logo">
            Admin Panel
        </div>

        <ul class="menu">

            <li>
                <a href="#" class="active">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="#">
                    Users
                </a>
            </li>

            <li>
                <a href="#">
                    Settings
                </a>
            </li>

        </ul>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="main">

        <!-- TOP HEADER -->

        <header class="top-header">

            <div>
                <button class="menu-btn" onclick="toggleSidebar()">
                    ☰
                </button>

                <span class="page-title">
                    Dashboard
                </span>
            </div>

            <div class="admin-section">

                <span class="admin-name">
                    Admin: John Doe
                </span>

                <button class="logout-btn" onclick="logout()">
                    Logout
                </button>

            </div>

        </header>


        <!-- CONTENT -->

        <section class="content">

            <!-- DASHBOARD CARDS -->

            <div class="cards">

                <div class="card">
                    <h3>Total Users</h3>
                    <p id="totalUsers">3</p>
                </div>

                <div class="card">
                    <h3>Active Users</h3>
                    <p id="activeUsers">3</p>
                </div>

                <div class="card">
                    <h3>Admin</h3>
                    <p>1</p>
                </div>

            </div>


            <!-- USER TABLE -->

            <div class="table-container">

                <div class="table-header">
            
                    <h2>Users</h2>
            
                    <button class="add-btn" onclick="openAddModal()">
                        + Add User
                    </button>
            
                </div>
            
                <table>
            
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
            
                    <tbody id="userTable">
                    </tbody>
            
                </table>
            
            </div>

        </section>

    </main>


    <!-- ================= ADD / EDIT MODAL ================= -->

    <div class="modal" id="userModal">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    Add User
                </h2>

                <span class="close" onclick="closeModal()">
                    &times;
                </span>

            </div>


            <form id="userForm">

                <div class="form-group">
                    <label>Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter name" required                    >
                </div>
            
               
            
                <div class="form-group">
                    <label>Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password" required
                    >
                </div>
            
                <div class="form-group">
                    <label>Role</label>
            
                    <select id="role" name="role" required>
                        <option value="User">User</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
            
                <button type="submit" class="save-btn">
                    Save User
                </button>
            
            </form>

        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.21.0/dist/jquery.validate.min.js"></script>
    <script>


$(document).ready(function() {

loadUsers();

});
        $(document).ready(function () {

$("#userForm").validate({

    submitHandler: function (form) {

        const data = {
            username: $("#name").val(),
            password: $("#password").val(),
            is_staff: $("#role").val() === "Admin"
        };

        $.ajax({
            url: "/admin/data_submit",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(data),

            success: function (response) {

                alert("User created successfully!");

                $("#userForm")[0].reset();

                closeModal();

                // Reload users table
                // loadUsers();
            },

            error: function (xhr) {

                console.log(xhr);

                if (xhr.responseJSON) {
                    alert(xhr.responseJSON.detail);
                } else {
                    alert("Something went wrong");
                }
            }
        });

        return false;
    }
});

});


function loadUsers() {

$.ajax({

    url: "/admin/users",
    type: "GET",

    success: function(users) {

        let table = $("#userTable");

        table.empty();

        users.forEach(function(user, index) {

            let role = user.is_staff ? "Admin" : "User";

            table.append(`
                <tr>

                    <td>${index + 1}</td>

                    <td>${user.username}</td>
                    <td>${role}</td>

                    <td>
                        <div class="action-buttons">

                            <button
                                class="edit-btn"
                                onclick="editUser(${user.id})">
                                Edit
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteUser(${user.id})">
                                Delete
                            </button>

                        </div>
                    </td>

                </tr>
            `);

        });

    },

    error: function(xhr) {

        console.log(xhr);

        alert("Failed to load users");

    }

});
}

        let editingRow = null;


        // Open Add User Modal

        function openAddModal() {

            editingRow = null;

            document.getElementById("modalTitle").innerText =
                "Add User";

            document.getElementById("userForm").reset();

            document.getElementById("userModal")
                .classList.add("active");
        }


        // Close Modal

        function closeModal() {

            document.getElementById("userModal")
                .classList.remove("active");

        }


        // Save User

        function saveUser(event) {

            event.preventDefault();

            const name =
                document.getElementById("name").value;

            const email =
                document.getElementById("email").value;

            const role =
                document.getElementById("role").value;


            // EDIT

            if (editingRow) {

                editingRow.cells[1].innerText = name;
                editingRow.cells[2].innerText = email;
                editingRow.cells[3].innerText = role;

            }

            // ADD

            else {

                const table =
                    document.getElementById("userTable");

                const row =
                    table.insertRow();

                const number =
                    table.rows.length;

                row.innerHTML = `

                    <td>${number}</td>

                    <td>${name}</td>

                    <td>${email}</td>

                    <td>${role}</td>

                    <td>
                        <span class="status">
                            Active
                        </span>
                    </td>

                    <td>

                        <div class="action-buttons">

                            <button
                                class="edit-btn"
                                onclick="editUser(this)">
                                Edit
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteUser(this)">
                                Delete
                            </button>

                        </div>

                    </td>

                `;

            }


            updateUserCount();

            closeModal();

        }


        // Edit User

        function editUser(button) {

            editingRow =
                button.closest("tr");

            document.getElementById("modalTitle")
                .innerText = "Edit User";

            document.getElementById("name").value =
                editingRow.cells[1].innerText;

            document.getElementById("email").value =
                editingRow.cells[2].innerText;

            document.getElementById("role").value =
                editingRow.cells[3].innerText;

            document.getElementById("userModal")
                .classList.add("active");
        }


        // Delete User

        function deleteUser(button) {

            const row =
                button.closest("tr");

            const name =
                row.cells[1].innerText;

            if (confirm(
                `Are you sure you want to delete ${name}?`
            )) {

                row.remove();

                updateRowNumbers();

                updateUserCount();

            }

        }


        // Update Row Numbers

        function updateRowNumbers() {

            const rows =
                document.querySelectorAll(
                    "#userTable tr"
                );

            rows.forEach((row, index) => {

                row.cells[0].innerText =
                    index + 1;

            });

        }


        // Update User Count

        function updateUserCount() {

            const count =
                document.querySelectorAll(
                    "#userTable tr"
                ).length;

            document.getElementById(
                "totalUsers"
            ).innerText = count;

            document.getElementById(
                "activeUsers"
            ).innerText = count;

        }


        // Sidebar

        function toggleSidebar() {

            document
                .getElementById("sidebar")
                .classList.toggle("show");

        }


        // Logout

        function logout() {

            if (confirm("Are you sure you want to logout?")) {

                // Replace this with your logout URL

                window.location.href = "/logout/";

            }

        }

    </script>

</body>
</html>
